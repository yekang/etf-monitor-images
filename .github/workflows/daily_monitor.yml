name: ETF Daily Monitor

# 触发条件：什么时候运行？
on:
  schedule:
    # 使用 Cron 表达式定时运行。注意：GitHub 服务器用的是 UTC 时间！
    # 北京时间 15:30 (A股收盘后半小时) = UTC 时间 07:30
    # 语法：分钟 小时 日 月 星期 (1-5 代表周一到周五)
    - cron: '20 01 * * 1-5'
    
  # 加入这个配置，允许您在网页上手动点击按钮立即运行测试
  workflow_dispatch:

jobs:
  run-monitor-script:
    runs-on: ubuntu-latest # 使用 GitHub 提供的免费 Ubuntu 服务器
    
    steps:
    # 1. 把你的仓库代码拉取到服务器上
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. 安装 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 安装脚本需要的依赖库 (注意：去掉了 akshare)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests matplotlib

    # 4. 安装中文字体，防止云端服务器画出来的图表中文变成方块框
    - name: Setup Fonts for Matplotlib
      run: |
        sudo apt-get update -y
        sudo apt-get install -y fonts-wqy-zenhei
        
    # 5. 注入机密环境变量，并运行你的脚本
    - name: Run Python Script
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      run: |
        python monitor.py
